<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Docker Deployment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h2>CloudApp</h2>
    </header>

    <main>
        <section class="hero">
            <h1>Welcome to My Cloud Application</h1>
            <p>
                A simple web application deployed on AWS using Flask,
                Docker, Ansible, and Terraform.
            </p>
            <button class="button" onclick="checkStatus()">Check System Status</button>
        </section>

        <section class="status-container">
            <div class="card">
                <h3>Application Status</h3>
                <p class="status" id="app-status">Checking...</p>
            </div>

            <div class="card">
                <h3>Database Status</h3>
                <p class="status" id="db-status">Checking...</p>
            </div>
        </section>
    </main>

    <footer>
        Automated Docker Deployment on AWS
    </footer>

    <script>
        async function checkStatus() {
            const appStatus = document.getElementById("app-status");
            const dbStatus = document.getElementById("db-status");

            appStatus.textContent = "Checking...";
            dbStatus.textContent = "Checking...";

            try {
                const response = await fetch("/health");
                const data = await response.json();

                appStatus.textContent =
                    response.ok && data.status === "healthy"
                    ? "Running ✓"
                    : "Unavailable";
            } catch (error) {
                appStatus.textContent = "Unavailable";
            }

            try {
                const response = await fetch("/db-health");
                const data = await response.json();

                dbStatus.textContent =
                    response.ok && data.status === "connected"
                    ? "Connected ✓"
                    : "Disconnected";
            } catch (error) {
                dbStatus.textContent = "Disconnected";
            }
        }

        checkStatus();
    </script>

</body>
</html>
